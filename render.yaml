# Render Blueprint: both halves of the project in one file.
#
# Deploy with: Render dashboard -> New -> Blueprint -> pick this repo.
# Render reads this file and creates both services.
#
# Order matters. VITE_SIGNALING_URL is inlined by Vite at BUILD time, so the signaling
# service must exist first; then set the variable on the static site and trigger a rebuild.

services:
  # ---------------------------------------------------------------- signaling
  # The y-webrtc relay. It is a plain Node process that speaks WebSocket and answers any
  # plain HTTP request with 200 "okay", which doubles as Render's health check.
  - type: web
    name: ds-signaling
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm run signaling
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      # PORT is injected by Render; the server reads process.env.PORT and binds to it.

  # ----------------------------------------------------------------- frontend
  # Static Vite build. The rewrite is what makes client-side routes such as
  # /room/<id> resolve instead of 404ing.
  - type: web
    name: ds-editor
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      # Set this in the dashboard AFTER ds-signaling is live, then redeploy.
      # Must be wss:// -- a page served over HTTPS cannot open an insecure WebSocket.
      - key: VITE_SIGNALING_URL
        sync: false
      # Optional TURN relay. Without it, peers behind symmetric NAT cannot connect.
      - key: VITE_TURN_URL
        sync: false
      - key: VITE_TURN_USERNAME
        sync: false
      - key: VITE_TURN_CREDENTIAL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
