# Serverless signaling deployment (Unit IV: Serverless Architectures, Cloudflare).
#
#   cd deploy/cloudflare
#   npx wrangler login
#   npx wrangler deploy
#
# Then rebuild the frontend with:
#   VITE_SIGNALING_URL=wss://ds-signaling.<your-subdomain>.workers.dev

name = "ds-signaling"
main = "src/worker.ts"
compatibility_date = "2026-01-01"

[[durable_objects.bindings]]
name = "SIGNALING_ROOM"
class_name = "SignalingRoom"

# SQLite-backed Durable Objects are the class available on the Workers free plan.
# The older key-value backing (`new_classes`) requires a paid Workers plan, so this is
# `new_sqlite_classes` to keep the deployment free. We keep no durable state anyway --
# signaling is discovery, not storage, and a peer that reconnects simply re-subscribes.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["SignalingRoom"]
